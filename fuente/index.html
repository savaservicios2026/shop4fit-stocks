<title>Shop4Fit Stocks</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=IBM+Plex+Mono:wght@500&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
/* Layout: barra superior + navegación por pestañas (abajo en móvil); cada vista es una hoja de trabajo de nave, densa y escaneable. */
:root{
  --bg:#edf0f3; --surface:#ffffff; --surface-2:#e2e7ec; --line:#cdd5de;
  --fg:#15202b; --muted:#566475; --accent:#2f5fc4; --accent-fg:#ffffff; --brand:#5680de; --brand-fg:#2f5fc4;
  --scan:#f2c230; --scan-fg:#1b1500;
  --ok:#1d7a46; --ok-bg:#dcefe3; --warn:#9a5c00; --warn-bg:#f8ead2; --bad:#b8322a; --bad-bg:#f6dedb;
  --shadow:0 1px 2px rgba(20,32,43,.06),0 4px 14px rgba(20,32,43,.06);
  --f-display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --f-body:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0f151b; --surface:#17202a; --surface-2:#212c37; --line:#2d3a47;
  --fg:#e5ecf2; --muted:#93a3b4; --accent:#86a8f0; --accent-fg:#0b1630; --brand:#5680de; --brand-fg:#86a8f0;
  --scan:#f2c230; --scan-fg:#1b1500;
  --ok:#55c98a; --ok-bg:#16301f; --warn:#eaa94a; --warn-bg:#352611; --bad:#f0776b; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0f151b; --surface:#17202a; --surface-2:#212c37; --line:#2d3a47;
  --fg:#e5ecf2; --muted:#93a3b4; --accent:#86a8f0; --accent-fg:#0b1630; --brand:#5680de; --brand-fg:#86a8f0;
  --scan:#f2c230; --scan-fg:#1b1500;
  --ok:#55c98a; --ok-bg:#16301f; --warn:#eaa94a; --warn-bg:#352611; --bad:#f0776b; --bad-bg:#3a1a17;
  --shadow:0 1px 2px rgba(0,0,0,.3);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--fg)}
body{font-family:var(--f-body);font-size:15px;line-height:1.45;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 96px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{font-family:var(--f-display);font-weight:700;letter-spacing:.01em;line-height:1.1;margin:0;text-wrap:balance}
h2{font-size:1.55rem}
h3{font-size:1.2rem}
.wrap{max-width:1180px;margin:0 auto}
.muted{color:var(--muted)}
.mono{font-family:var(--f-mono);font-size:.88em;letter-spacing:.02em}
.num{font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* Cabecera */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--bg);display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding-block:12px 10px;border-bottom:1px solid var(--line)}
.brand{display:flex;align-items:center;gap:10px;margin-right:auto;min-width:0}
.logo{width:40px;height:40px;border-radius:10px;background:var(--brand);display:grid;place-items:center;flex:none}
.logo img{width:26px;height:auto}
.brand h1 span{color:var(--brand-fg)}
.brand h1{font-size:1.7rem;text-transform:uppercase;letter-spacing:.04em}
.brand .tag{font-family:var(--f-mono);font-size:.72rem;color:var(--muted);text-transform:uppercase;letter-spacing:.08em}
.modo{font-size:.75rem;padding:3px 9px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.modo.nube{background:var(--ok-bg);color:var(--ok)}
nav.tabs{display:flex;gap:4px}
nav.tabs button{background:none;border:0;padding:8px 12px;border-radius:8px;cursor:pointer;color:var(--muted);font-weight:500;display:flex;align-items:center;gap:6px}
nav.tabs button svg{width:18px;height:18px}
nav.tabs button[aria-current="page"]{background:var(--surface);color:var(--fg);box-shadow:var(--shadow)}
nav.tabs button:hover{color:var(--fg)}
@media (max-width:760px){
  nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:25;background:var(--surface);border-top:1px solid var(--line);justify-content:space-around;padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
  nav.tabs button{flex-direction:column;gap:2px;font-size:.7rem;padding:6px 4px;flex:1}
  nav.tabs button[aria-current="page"]{box-shadow:none;background:var(--surface-2)}
  .brand h1{font-size:1.4rem}
}

main{padding-top:18px;display:grid;gap:18px}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;min-width:0}
.grid2{display:grid;grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:900px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stack{display:grid;gap:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.row>.grow{flex:1 1 180px;min-width:0}
.head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:space-between}

.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line);background:var(--surface);padding:9px 14px;border-radius:8px;cursor:pointer;font-weight:500;text-decoration:none;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-fg)}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.btn.small{padding:5px 10px;font-size:.85rem}
.btn.ghost{border-color:transparent;background:transparent}
.btn:disabled{opacity:.5;cursor:not-allowed}
.btn svg{width:18px;height:18px}
.scanBtn{background:var(--scan);color:var(--scan-fg);border-color:var(--scan);font-family:var(--f-display);font-size:1.3rem;text-transform:uppercase;letter-spacing:.05em;padding:16px 22px;flex:1 1 220px}
.scanBtn svg{width:26px;height:26px}
.scanBtn:hover{border-color:var(--scan-fg)}

label.lbl,.lbl{display:block;font-size:.74rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);margin-bottom:4px;font-weight:600}
input[type=text],input[type=number],input[type=date],input[type=search],select,textarea{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:9px 11px;min-width:0}
textarea{min-height:64px;resize:vertical}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.fields .full{grid-column:1/-1}

.seg{display:flex;border:1px solid var(--line);border-radius:9px;overflow:hidden;background:var(--bg)}
.seg button{flex:1;border:0;background:none;padding:10px 6px;cursor:pointer;font-weight:600;color:var(--muted)}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"].entrada{background:var(--ok-bg);color:var(--ok)}
.seg button[aria-pressed="true"].salida{background:var(--bad-bg);color:var(--bad)}
.seg button[aria-pressed="true"].ajuste{background:var(--warn-bg);color:var(--warn)}
.seg button[aria-pressed="true"].neutral{background:var(--surface);color:var(--fg)}

.qty{display:flex;align-items:stretch}
.qty button{width:46px;border:1px solid var(--line);background:var(--surface-2);cursor:pointer;font-size:1.3rem}
.qty button:first-child{border-radius:8px 0 0 8px}
.qty button:last-child{border-radius:0 8px 8px 0}
.qty input{border-radius:0;text-align:center;font-size:1.25rem;font-weight:600;font-variant-numeric:tabular-nums;border-left:0;border-right:0}

.prod{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 16px;align-items:center;padding:14px;border:1px solid var(--line);border-radius:var(--r);background:var(--bg)}
.prod .nm{font-weight:600;font-size:1.08rem}
.stockBig{grid-row:span 3;text-align:right}
.stockBig b{display:block;font-family:var(--f-display);font-size:2.4rem;line-height:1;font-variant-numeric:tabular-nums}
.stockBig small{color:var(--muted);font-size:.75rem;text-transform:uppercase;letter-spacing:.06em}
.lowc{color:var(--bad)}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:.74rem;font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--muted);white-space:nowrap}
.pill.ok{background:var(--ok-bg);color:var(--ok)}
.pill.warn{background:var(--warn-bg);color:var(--warn)}
.pill.bad{background:var(--bad-bg);color:var(--bad)}
.pill.info{background:var(--surface-2);color:var(--accent)}
.cat{font-size:.8rem;color:var(--muted)}

.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:5px 11px;cursor:pointer;font-size:.85rem;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--fg);color:var(--bg);border-color:var(--fg)}
.chip .n{opacity:.65;margin-left:4px;font-variant-numeric:tabular-nums}

.list{display:grid}
.item{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 14px;padding:11px 4px;border-top:1px solid var(--line);align-items:center;cursor:pointer;text-align:left;background:none;border-left:0;border-right:0;border-bottom:0;width:100%}
.item:first-child{border-top:0}
.item:hover{background:var(--bg)}
.item .t{font-weight:600;min-width:0;overflow-wrap:anywhere}
.item .s{font-size:.82rem;color:var(--muted);min-width:0;overflow-wrap:anywhere}
.item .r{text-align:right;grid-row:span 2;font-variant-numeric:tabular-nums}
.item .r b{font-size:1.15rem}
.item.static{cursor:default}
.item.static:hover{background:none}

.mov{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:2px 12px;padding:9px 2px;border-top:1px solid var(--line);align-items:center}
.mov:first-child{border-top:0}
.mov .sg{font-family:var(--f-display);font-size:1.25rem;font-weight:700;min-width:54px;text-align:right;font-variant-numeric:tabular-nums}
.mov .sg.in{color:var(--ok)} .mov .sg.out{color:var(--bad)} .mov .sg.adj{color:var(--warn)}
.mov .d{font-size:.8rem;color:var(--muted);text-align:right;white-space:nowrap}

.tableWrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:.9rem}
th,td{text-align:left;padding:8px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
th{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}

.bar{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:99px}
.bar.ok i{background:var(--ok)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.kpi .v{font-family:var(--f-display);font-size:2rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1;margin-top:4px}

.hbars{display:grid;gap:10px}
.hb{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 12px}
.hb .lb{font-size:.9rem;min-width:0;overflow-wrap:anywhere}
.hb .vl{font-size:.9rem;font-variant-numeric:tabular-nums;text-align:right;font-weight:600}
.hb .bar{grid-column:1/-1;height:12px}
.hb .bar i{background:var(--c,var(--accent))}

.empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:var(--r)}
.notice{padding:10px 14px;border-radius:var(--r);background:var(--warn-bg);color:var(--warn);display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.notice.info{background:var(--surface-2);color:var(--fg)}

.label{background:#fff;color:#111;border-radius:8px;padding:12px;display:grid;justify-items:center;gap:4px;border:1px solid var(--line)}
.label svg{max-width:100%;height:auto}
.label .ln{font-family:var(--f-body);font-weight:600;font-size:.85rem;text-align:center}

/* Modal */
.ov{position:fixed;inset:0;z-index:40;background:rgba(10,16,22,.5);display:flex;align-items:flex-start;justify-content:center;overflow-y:auto;padding:calc(24px + env(safe-area-inset-top,0px)) max(12px,env(safe-area-inset-right,0px)) calc(24px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.md{background:var(--surface);border-radius:14px;width:100%;max-width:720px;box-shadow:0 20px 60px rgba(0,0,0,.3);border:1px solid var(--line)}
.md>header{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;padding:16px 18px;border-bottom:1px solid var(--line)}
.md>.bd{padding:18px;display:grid;gap:16px}
.md>footer{padding:14px 18px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end;flex-wrap:wrap}
.x{background:none;border:0;font-size:1.6rem;line-height:1;cursor:pointer;color:var(--muted);padding:0 4px}
.lineas{display:grid;gap:8px}
.linea{display:grid;grid-template-columns:minmax(0,1fr) 90px 110px auto;gap:6px;align-items:center}
@media (max-width:560px){.linea{grid-template-columns:minmax(0,1fr) 80px auto}.linea .pr{grid-column:1/3}}
.checks{display:grid;gap:4px;max-height:220px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:6px}
.checks label{display:flex;gap:8px;align-items:flex-start;padding:6px;border-radius:6px;cursor:pointer}
.checks label:hover{background:var(--bg)}

.dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--bad);margin-right:6px;vertical-align:1px}
nav.tabs button{position:relative}
nav.tabs .badge{position:absolute;top:2px;right:2px;min-width:17px;height:17px;padding:0 4px;border-radius:99px;background:var(--bad);color:#fff;font-size:.68rem;font-weight:700;line-height:17px;text-align:center}
.msgs{display:grid;gap:8px;max-height:46vh;overflow-y:auto}
.msg{background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 12px;display:grid;gap:3px}
.msg .tx{white-space:pre-wrap;overflow-wrap:anywhere}
#login[hidden]{display:none}
#video{width:100%;border-radius:var(--r);background:#000;max-height:50vh;object-fit:cover}

.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));z-index:50;background:var(--fg);color:var(--bg);padding:10px 16px;border-radius:10px;box-shadow:var(--shadow);font-weight:500;max-width:calc(100% - 32px)}
.toast.err{background:var(--bad);color:#fff}
@media (prefers-reduced-motion:no-preference){.toast{animation:up .2s ease-out}@keyframes up{from{transform:translate(-50%,8px);opacity:.4}}}

svg.chart text{fill:var(--muted);font-family:var(--f-body);font-size:11px}
svg.chart .grid{stroke:var(--line)}
svg.chart rect.b{fill:var(--accent)}
svg.chart rect.b.cur{fill:var(--scan)}
</style>

<script src="https://unpkg.com/@zxing/library@0.21.3/umd/index.min.js"></script>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
"use strict";
/* ============ Constantes ============ */
const CATS = [
  {id:"musculacion", nombre:"Máquinas de musculación", subs:["Placas","Palanca"], c:"#3b7dd8"},
  {id:"cardio", nombre:"Máquinas cardiovasculares", subs:[], c:"#d8613b"},
  {id:"funcional", nombre:"Material funcional de salas colectivas", subs:[], c:"#2a9d78"},
  {id:"peso-libre", nombre:"Peso libre", subs:[], c:"#8a5cc9"},
  {id:"suelos", nombre:"Suelos técnicos", subs:["Loseta","Césped","Carriles de césped","Tatami"], c:"#c99a1c"},
  {id:"estructuras", nombre:"Estructuras", subs:[], c:"#6b7d8f"},
];
const CAT = Object.fromEntries(CATS.map(c=>[c.id,c]));
const ORIGEN = {china:"Importación China", proveedor:"Proveedor nacional"};
const UNIDADES = ["ud","m²","m","rollo","kg","juego","par"];
const MOTIVOS = {
  entrada:[["compra","Compra a proveedor"],["devolucion-cliente","Devolución de cliente"],["otra-entrada","Otra entrada"]],
  salida:[["venta","Venta a cliente"],["devolucion-proveedor","Devolución a proveedor"],["merma","Rotura o merma"],["uso-interno","Uso interno / exposición"]],
  ajuste:[["inventario","Recuento de inventario"]],
};
const MOTIVO_TXT = Object.fromEntries(Object.values(MOTIVOS).flat());
const DOCS = [["albaran","Albarán"],["presupuesto","Presupuesto"],["factura","Factura"],["proforma","Proforma"]];
const DOC_TXT = Object.fromEntries(DOCS);
const COLS = ["productos","movimientos","pedidosProveedor","pedidosCliente","solicitudes"];
const CANALES = {whatsapp:"WhatsApp", correo:"Correo", telefono:"Teléfono", web:"Web", visita:"En persona", otro:"Otro"};
const ESTADOS_SOL = [["nueva","Nueva"],["curso","En curso"],["presupuestada","Presupuestada"],["aceptada","Aceptada"],["descartada","Descartada"]];
const ESTADO_SOL_TXT = Object.fromEntries(ESTADOS_SOL);
const LS_KEY = "control-stock-v1";

/* ============ Estado ============ */
const S = {productos:new Map(), movimientos:new Map(), pedidosProveedor:new Map(), pedidosCliente:new Map(), solicitudes:new Map()};
const errCol = {};
let modo = "cargando", db = null, userCap = null, dl = null, miId = null, cargado = {};
let vista = "escanear";
try { const v = localStorage.getItem(LS_KEY+":vista"); if (v) vista = v; } catch(e) {}
let C = null; // cálculos derivados
const F = nuevoF(); // formulario de movimiento
const UI = {cat:"", origen:"", bajo:false, q:"", tipoPed:"proveedor", qPed:"", periodo:"12m", agrupar:"categoria", metrica:"imp", qMov:"", tipoMov:"", estSol:"atender", canalSol:"", qSol:""};
let modal = null;
const nombres = {};
const enMarco = (()=>{ try { return window.self !== window.top; } catch(e) { return true; } })();

function nuevoF(){ return {pid:null, tipo:"entrada", motivo:"compra", cantidad:1, contado:"", pedido:"", docTipo:"albaran", docNum:"", precio:"", nota:"", busqueda:"", resultados:null, noEncontrado:null}; }

/* ============ Utilidades ============ */
const $ = s => document.querySelector(s);
const h = v => String(v ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const nf = new Intl.NumberFormat("es-ES",{maximumFractionDigits:2});
const ef = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR",maximumFractionDigits:0});
const ef2 = new Intl.NumberFormat("es-ES",{style:"currency",currency:"EUR"});
const fN = n => nf.format(n||0);
const fE = n => ef.format(n||0);
const fE2 = n => ef2.format(n||0);
const num = v => { const n = parseFloat(String(v).replace(",",".")); return isFinite(n) ? n : 0; };
const nuevoId = () => Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,8);
const hoy = () => new Date().toISOString().slice(0,10);
function fFecha(iso, conHora){
  if (!iso) return "";
  const d = new Date(iso);
  const o = {day:"2-digit", month:"short", year: (new Date().getFullYear()===d.getFullYear()?undefined:"2-digit")};
  if (conHora) { o.hour = "2-digit"; o.minute = "2-digit"; }
  return d.toLocaleString("es-ES", o);
}
function toast(msg, err){
  const t = $("#toast");
  t.innerHTML = `<div class="toast ${err?"err":""}">${h(msg)}</div>`;
  clearTimeout(toast._t); toast._t = setTimeout(()=> t.innerHTML = "", err ? 5000 : 2600);
}
const catNombre = p => p ? (CAT[p.categoria]?.nombre || "Sin categoría") + (p.sub ? " · " + p.sub : "") : "";
function eanCheck(d12){ let s=0; for (let i=0;i<12;i++) s += (+d12[i]) * (i%2 ? 3 : 1); return (10 - s%10) % 10; }
// Código interno EAN-13 con prefijo 20 (reservado para uso interno): el siguiente libre de la serie
function codigoInterno(extra){
  const usados = [...S.productos.values()].map(p => p.codigo).concat(extra || []).filter(c => /^20\d{11}$/.test(c || "")).map(c => +c.slice(0,12));
  const base = String(usados.length ? Math.max(...usados) + 1 : 200000000001);
  return base + eanCheck(base);
}
const esEAN13 = c => /^\d{13}$/.test(c) && eanCheck(c.slice(0,12)) === +c[12];

/* ============ Almacenamiento: nube (db) o este dispositivo ============ */
async function iniciar(){
  pintar();
  if (window.FIREBASE_CONFIG && window.firebase) return iniciarFirebase();
  const c = window.claude;
  if (c && typeof c.use === "function") {
    try { [db, userCap, dl] = await Promise.all([c.use("db"), c.use("user"), c.use("downloads")]); } catch(e) { db = null; }
  }
  if (db) {
    modo = "nube";
    try { miId = userCap ? await userCap.id() : null; } catch(e) {}
    for (const col of COLS) {
      db.collection(col).onSnapshot(snap => {
        const m = new Map();
        snap.docs.forEach(d => m.set(d.id, {...d.data(), id:d.id}));
        S[col] = m; cargado[col] = true; pintar();
      }, err => { cargado[col] = true; errCol[col] = err.code || "error"; pintar(); if (col !== "solicitudes") toast("No se pudo sincronizar ("+err.code+"). Recarga la página.", true); });
    }
  } else {
    modo = "local";
    try {
      const raw = JSON.parse(localStorage.getItem(LS_KEY) || "{}");
      for (const col of COLS) S[col] = new Map(Object.entries(raw[col] || {}).map(([k,v]) => [k, {...v, id:k}]));
    } catch(e) {}
    COLS.forEach(c => cargado[c] = true);
    pintar();
  }
}
/* Versión alojada (Shop4Fit Stocks en GitHub Pages): Firebase Auth + Firestore con un único acceso de oficina */
let fbSubs = [];
function iniciarFirebase(){
  firebase.initializeApp(window.FIREBASE_CONFIG);
  const auth = firebase.auth(), fs = firebase.firestore();
  fs.enablePersistence({synchronizeTabs:true}).catch(() => {});
  db = {collection: c => fs.collection(c)};
  modo = "nube"; pintar();
  const login = $("#login"), salir = $("#salir");
  login.querySelector(".logo").innerHTML = document.querySelector(".top .logo").innerHTML;
  login.addEventListener("submit", async e => {
    e.preventDefault();
    const err = $("#loginErr"), b = login.querySelector("button"); err.textContent = ""; b.disabled = true;
    try { await auth.signInWithEmailAndPassword($("#loginEmail").value.trim(), $("#loginPass").value); }
    catch(x) { err.textContent = /wrong-password|invalid-credential|user-not-found|invalid-email|invalid-login/.test(x.code||"") ? "Correo o contraseña incorrectos." : x.code === "auth/too-many-requests" ? "Demasiados intentos. Espera unos minutos." : "No se pudo entrar. Comprueba la conexión."; }
    b.disabled = false;
  });
  salir.addEventListener("click", () => auth.signOut());
  auth.onAuthStateChanged(u => {
    fbSubs.forEach(f => f()); fbSubs = [];
    if (!u) { COLS.forEach(c => { S[c] = new Map(); cargado[c] = false; }); login.hidden = false; salir.hidden = true; pintar(); setTimeout(() => $("#loginEmail")?.focus(), 50); return; }
    login.hidden = true; salir.hidden = false; miId = u.email || u.uid;
    for (const col of COLS) fbSubs.push(fs.collection(col).onSnapshot(snap => {
      const m = new Map(); snap.docs.forEach(d => m.set(d.id, {...d.data(), id:d.id}));
      S[col] = m; cargado[col] = true; pintar();
    }, err => { cargado[col] = true; errCol[col] = err.code || "error"; pintar(); if (col !== "solicitudes") toast("No se pudo leer «" + col + "» (" + (err.code||"error") + ").", true); }));
  });
}
function persistirLocal(){
  try {
    const o = {}; for (const col of COLS) o[col] = Object.fromEntries([...S[col]].map(([k,v]) => { const {id, ...r} = v; return [k, r]; }));
    localStorage.setItem(LS_KEY, JSON.stringify(o));
  } catch(e) { toast("No se pudo guardar en este dispositivo", true); }
}
async function guardar(col, id, data){
  const limpio = JSON.parse(JSON.stringify(data)); delete limpio.id;
  if (modo === "nube" && window.FIREBASE_CONFIG) { db.collection(col).doc(id).set(limpio).catch(errorGuardar); return; } // sin esperar al servidor: funciona sin cobertura
  if (modo === "nube") {
    try { await db.collection(col).doc(id).set(limpio); }
    catch(e) {
      if (e && e.code === "unavailable") { await new Promise(r => setTimeout(r, 400 + Math.random()*600)); return db.collection(col).doc(id).set(limpio); }
      throw e;
    }
  } else { S[col].set(id, {...limpio, id}); persistirLocal(); pintar(); }
}
async function borrar(col, id){
  if (modo === "nube" && window.FIREBASE_CONFIG) { db.collection(col).doc(id).delete().catch(errorGuardar); return; }
  if (modo === "nube") await db.collection(col).doc(id).delete();
  else { S[col].delete(id); persistirLocal(); pintar(); }
}
function errorGuardar(e){
  const c = e && e.code;
  if (c === "invalid_argument" || c === "permission-denied") toast("No tienes permiso para modificar datos en esta página.", true);
  else if (c === "quota_exceeded") toast("La base de datos está llena. Exporta y archiva movimientos antiguos.", true);
  else toast("No se pudo guardar. Comprueba la conexión e inténtalo de nuevo.", true);
}

/* ============ Cálculos derivados (stock = suma de movimientos) ============ */
function calcular(){
  const stock = new Map(), recibido = new Map(), servido = new Map(), ultimo = new Map();
  const movs = [...S.movimientos.values()].sort((a,b) => (b.fecha||"").localeCompare(a.fecha||""));
  for (const m of movs) {
    const q = num(m.cantidad);
    const d = m.tipo === "entrada" ? q : m.tipo === "salida" ? -q : q;
    stock.set(m.productoId, (stock.get(m.productoId)||0) + d);
    if (!ultimo.has(m.productoId)) ultimo.set(m.productoId, m.fecha);
    if (m.pedidoProveedorId) { const k = m.pedidoProveedorId+"|"+m.productoId; recibido.set(k, (recibido.get(k)||0) + (m.tipo==="entrada"?q:m.tipo==="salida"?-q:0)); }
    if (m.pedidoClienteId) { const k = m.pedidoClienteId+"|"+m.productoId; servido.set(k, (servido.get(k)||0) + (m.tipo==="salida"?q:m.tipo==="entrada"?-q:0)); }
  }
  const estadoProv = new Map(), estadoCli = new Map();
  const pendienteRecibir = new Map(); // productoId -> unidades en pedidos de proveedor abiertos
  for (const p of S.pedidosProveedor.values()) {
    let tot=0, rec=0;
    for (const l of p.lineas||[]) {
      const q = num(l.cantidad), r = Math.max(0, recibido.get(p.id+"|"+l.productoId)||0);
      tot += q; rec += Math.min(q, r);
      if (!p.cancelado) pendienteRecibir.set(l.productoId, (pendienteRecibir.get(l.productoId)||0) + Math.max(0, q-r));
    }
    estadoProv.set(p.id, {tot, rec, est: p.cancelado ? "Cancelado" : tot && rec>=tot ? "Recibido" : rec>0 ? "Parcial" : "Pendiente"});
  }
  const reservado = new Map();
  for (const p of S.pedidosCliente.values()) {
    let tot=0, ser=0;
    for (const l of p.lineas||[]) {
      const q = num(l.cantidad), s = Math.max(0, servido.get(p.id+"|"+l.productoId)||0);
      tot += q; ser += Math.min(q, s);
      if (!p.cancelado) reservado.set(l.productoId, (reservado.get(l.productoId)||0) + Math.max(0, q-s));
    }
    estadoCli.set(p.id, {tot, ser, est: p.cancelado ? "Cancelado" : tot && ser>=tot ? "Servido" : ser>0 ? "Parcial" : "Pendiente"});
  }
  return {stock, recibido, servido, ultimo, movs, estadoProv, estadoCli, pendienteRecibir, reservado};
}
const stockDe = id => C.stock.get(id) || 0;
const esBajo = p => p.stockMin !== undefined && p.stockMin !== "" && stockDe(p.id) <= num(p.stockMin);
const pillEstado = e => `<span class="pill ${ {Recibido:"ok",Servido:"ok",Parcial:"warn",Pendiente:"info",Cancelado:""}[e] }">${e}</span>`;
const prodNombre = id => S.productos.get(id)?.nombre || "Producto eliminado";
function etiquetaCli(p){ if (!p) return "Pedido eliminado"; const r = [p.presupuesto && "Presup. "+p.presupuesto, p.albaran && "Albarán "+p.albaran].filter(Boolean).join(" · "); return (p.cliente||"Cliente") + (r ? " — " + r : p.numero ? " — " + p.numero : ""); }
function etiquetaProv(p){ return p ? (p.proveedor||"Proveedor") + (p.numero ? " — " + p.numero : "") : "Pedido eliminado"; }

/* ============ Pintado ============ */
let pendientePintar = false;
function pintar(){ if (pendientePintar) return; pendientePintar = true; requestAnimationFrame(()=>{ pendientePintar = false; pintarYa(); }); }
function pintarYa(){
  const a = document.activeElement, aid = a && a.id; let s0=null, s1=null;
  try { s0 = a.selectionStart; s1 = a.selectionEnd; } catch(e) {}
  C = calcular();
  const md = $("#modo");
  md.className = "modo " + (modo === "nube" ? "nube" : "");
  md.textContent = modo === "nube" ? "Sincronizado" : modo === "local" ? "Guardado en este dispositivo" : "Cargando…";
  document.querySelectorAll("#tabs button").forEach(b => b.setAttribute("aria-current", b.dataset.v === vista ? "page" : "false"));
  const nSol = [...S.solicitudes.values()].filter(x => x.sinLeer || (x.estado||"nueva") === "nueva").length, bs = $("#badgeSol");
  bs.hidden = !nSol; bs.textContent = nSol > 99 ? "99+" : nSol;
  $("#vista").innerHTML = (VISTAS[vista] || VISTAS.escanear)();
  abrirCompartido();
  if (modal && modal.vivo) pintarModal();
  if (aid) { const e = document.getElementById(aid); if (e && e !== document.activeElement) { e.focus({preventScroll:true}); try { if (s0 !== null) e.setSelectionRange(s0, s1); } catch(x) {} } }
  resolverNombres();
}
async function resolverNombres(){
  if (!userCap || typeof userCap.profiles !== "function") return;
  const ids = [...new Set(C.movs.slice(0,200).map(m => m.autor).filter(id => id && !(id in nombres)))];
  if (!ids.length) return;
  ids.forEach(id => nombres[id] = "");
  try { const ps = await userCap.profiles(ids); let nuevo = false; for (const id of ids) { const n = ps[id]?.name || ""; if (n) { nombres[id] = n; nuevo = true; } } if (nuevo) pintar(); } catch(e) {}
}

const hayEjemplos = () => COLS.some(c => [...S[c].values()].some(d => d.ejemplo));
function avisoEjemplos(){
  return hayEjemplos() ? `<div class="notice info"><span>Hay <b>datos de ejemplo</b> para que veas cómo funciona. Bórralos cuando vayas a empezar con los tuyos.</span><button class="btn small" data-a="borrarEjemplos">${UI.confEj ? "Confirmar: borrar ejemplos" : "Borrar ejemplos"}</button></div>` : "";
}
function cargando(){ return COLS.every(c => cargado[c]) ? "" : `<div class="empty">Cargando datos…</div>`; }

const VISTAS = {};

/* ---------- Escanear / registrar movimiento ---------- */
VISTAS.escanear = () => {
  const p = F.pid ? S.productos.get(F.pid) : null;
  const bajos = [...S.productos.values()].filter(esBajo).sort((a,b)=>stockDe(a.id)-stockDe(b.id));
  const pend = [...S.pedidosProveedor.values()].filter(x => ["Pendiente","Parcial"].includes(C.estadoProv.get(x.id)?.est)).sort((a,b)=>(a.fechaPrevista||"9").localeCompare(b.fechaPrevista||"9"));
  return `${avisoEjemplos()}${cargando()}
  <div class="grid2">
    <section class="panel stack" aria-labelledby="tReg">
      <div><h2 id="tReg">Registrar entrada o salida</h2><p class="muted" style="margin:4px 0 0">Escanea el código de barras del producto. También funciona un lector de códigos USB o Bluetooth: dispara y el producto aparece solo.</p></div>
      <div class="row">
        <label class="btn scanBtn" for="fotoScan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7V4h3M21 7V4h-3M3 17v3h3M21 17v3h-3M7 8v8M10 8v8M13 8v8M17 8v8"/></svg>Escanear código</label>
        <input class="vh" id="fotoScan" type="file" accept="image/*" capture="environment" data-scan="mov">
        ${!enMarco ? `<button class="btn" data-a="vivo">Cámara en directo</button>` : ""}
      </div>
      <div>
        <label class="lbl" for="busca">Código, referencia o nombre</label>
        <div class="row"><input class="grow" id="busca" type="search" autocomplete="off" data-f="busqueda" value="${h(F.busqueda)}" placeholder="8412345678901 o «prensa»"><button class="btn" data-a="buscar">Buscar</button></div>
      </div>
      ${F.noEncontrado ? `<div class="notice"><span>El código <b class="mono">${h(F.noEncontrado)}</b> no está dado de alta.</span><button class="btn small primary" data-a="nuevoProd" data-codigo="${h(F.noEncontrado)}">Dar de alta producto</button></div>` : ""}
      ${F.resultados ? (F.resultados.length ? `<div><div class="lbl">Elige el producto</div><div class="list">${F.resultados.map(r => `<button class="item" data-a="elegir" data-id="${r.id}"><span class="t">${h(r.nombre)}</span><span class="r"><b>${fN(stockDe(r.id))}</b> ${h(r.unidad||"ud")}</span><span class="s">${h(catNombre(r))} · <span class="mono">${h(r.codigo||"sin código")}</span></span></button>`).join("")}</div></div>` : `<div class="empty">No hay productos que coincidan con «${h(F.busqueda)}».</div>`) : ""}
      ${p ? formMovimiento(p) : (!F.resultados && !F.noEncontrado ? `<div class="empty">Escanea o busca un producto para registrar el movimiento.</div>` : "")}
    </section>
    <div class="stack">
      <section class="panel stack">
        <div class="head"><h3>Stock bajo</h3><span class="pill ${bajos.length?"bad":"ok"}">${bajos.length}</span></div>
        ${bajos.length ? `<div class="list">${bajos.slice(0,6).map(b => `<button class="item" data-a="verProd" data-id="${b.id}"><span class="t">${h(b.nombre)}</span><span class="r lowc"><b>${fN(stockDe(b.id))}</b> / ${fN(b.stockMin)}</span><span class="s">${h(catNombre(b))}${C.pendienteRecibir.get(b.id) ? ` · <b>${fN(C.pendienteRecibir.get(b.id))}</b> en camino` : ""}</span></button>`).join("")}</div>` : `<p class="muted" style="margin:0">Ningún producto por debajo de su stock mínimo.</p>`}
      </section>
      <section class="panel stack">
        <div class="head"><h3>Pendiente de recibir</h3><span class="pill info">${pend.length}</span></div>
        ${pend.length ? `<div class="list">${pend.slice(0,5).map(x => { const e = C.estadoProv.get(x.id); return `<button class="item" data-a="verPedProv" data-id="${x.id}"><span class="t">${h(etiquetaProv(x))}</span><span class="r">${pillEstado(e.est)}</span><span class="s">${h(ORIGEN[x.origen]||"")} · ${fN(e.rec)}/${fN(e.tot)} recibidas${x.fechaPrevista ? " · llega " + fFecha(x.fechaPrevista) : ""}</span></button>`; }).join("")}</div>` : `<p class="muted" style="margin:0">No hay pedidos a proveedor abiertos.</p>`}
      </section>
      <section class="panel stack">
        <div class="head"><h3>Últimos movimientos</h3><button class="btn small ghost" data-v="movimientos">Ver todos</button></div>
        ${C.movs.length ? `<div>${C.movs.slice(0,6).map(filaMov).join("")}</div>` : `<p class="muted" style="margin:0">Aún no hay movimientos.</p>`}
      </section>
    </div>
  </div>`;
};

function pedidosParaProducto(pid, tipo){
  if (tipo === "entrada") return [...S.pedidosProveedor.values()].filter(x => !x.cancelado && (x.lineas||[]).some(l => l.productoId === pid) && C.estadoProv.get(x.id)?.est !== "Recibido");
  if (tipo === "salida") return [...S.pedidosCliente.values()].filter(x => !x.cancelado && (x.lineas||[]).some(l => l.productoId === pid) && C.estadoCli.get(x.id)?.est !== "Servido");
  return [];
}

function pedidoLinea(tipo, pedId, pid){
  const ped = tipo === "entrada" ? S.pedidosProveedor.get(pedId) : S.pedidosCliente.get(pedId);
  const l = ped && (ped.lineas||[]).find(x => x.productoId === pid);
  if (!l) return null;
  const hecho = (tipo === "entrada" ? C.recibido : C.servido).get(pedId+"|"+pid) || 0;
  return {cantidad:num(l.cantidad), hecho:Math.max(0,hecho), precio:l.precio ?? l.coste, ped};
}
function seleccionarProducto(pid, preset){
  Object.assign(F, nuevoF(), {pid}, preset||{});
  const p = S.productos.get(pid);
  if (!preset || preset.precio === undefined) F.precio = F.tipo === "entrada" ? (p?.coste ?? "") : (p?.pvp ?? "");
  if (preset && preset.pedido) aplicarPedido();
  vista = "escanear"; cerrarModal(); pintar();
  setTimeout(()=>{ const c = document.getElementById("cantidad"); if (c) { c.focus({preventScroll:true}); c.select(); } $("#vista").scrollIntoView({block:"start"}); }, 60);
}
function aplicarPedido(){
  if (!F.pedido || !F.pid) return;
  const l = pedidoLinea(F.tipo, F.pedido, F.pid); if (!l) return;
  const falta = Math.max(0, l.cantidad - l.hecho); if (falta) F.cantidad = falta;
  if (l.precio !== undefined && l.precio !== "") F.precio = l.precio;
  if (F.tipo === "salida") { F.motivo = "venta"; if (l.ped.albaran) { F.docTipo = "albaran"; F.docNum = l.ped.albaran; } else if (l.ped.presupuesto) { F.docTipo = "presupuesto"; F.docNum = l.ped.presupuesto; } }
  if (F.tipo === "entrada") { F.motivo = "compra"; if (l.ped.docRef) { F.docTipo = "albaran"; F.docNum = l.ped.docRef; } }
}
function buscar(texto){
  const t = String(texto||"").trim();
  F.busqueda = t; F.resultados = null; F.noEncontrado = null;
  if (!t) { pintar(); return; }
  const prods = [...S.productos.values()];
  const exacto = prods.find(p => (p.codigo && p.codigo === t) || (p.ref && p.ref.toLowerCase() === t.toLowerCase()));
  if (exacto) { seleccionarProducto(exacto.id); toast("Producto: " + exacto.nombre); return; }
  const tl = t.toLowerCase();
  const res = prods.filter(p => [p.nombre, p.ref, p.codigo, p.proveedor].some(v => v && String(v).toLowerCase().includes(tl)));
  F.pid = null;
  if (res.length === 1) { seleccionarProducto(res[0].id); return; }
  if (!res.length && /^[\w\-.]{4,}$/.test(t) && /\d/.test(t)) F.noEncontrado = t; else F.resultados = res.slice(0,20);
  pintar();
}
async function registrar(){
  const p = S.productos.get(F.pid); if (!p) return;
  let cantidad;
  if (F.tipo === "ajuste") {
    if (F.contado === "" ) { toast("Escribe el stock contado", true); return; }
    cantidad = num(F.contado) - stockDe(p.id);
    if (cantidad === 0) { toast("El recuento coincide con el stock. No hay nada que ajustar."); Object.assign(F, nuevoF()); pintar(); return; }
  } else {
    cantidad = num(F.cantidad);
    if (!(cantidad > 0)) { toast("La cantidad tiene que ser mayor que cero", true); return; }

    pedidoProveedorId: F.tipo==="entrada" ? F.pedido : "", pedidoClienteId: F.tipo==="salida" ? F.pedido : "", nota:F.nota.trim(), autor: miId || ""};
  const btn = document.querySelector('[data-a="registrar"]'); if (btn) btn.disabled = true;

/* ---------- Solicitudes de presupuesto (WhatsApp, correo, teléfono…) ---------- */
// Cada solicitud es la conversación con un contacto: mensajes[] + datos de contacto + presupuestos (pedidosCliente) vinculados.
// Los importadores automáticos (correo y WhatsApp) solo crean solicitudes y añaden mensajes; el estado lo lleva la oficina.
function normTel(s){
  let d = String(s||"").replace(/[^\d+]/g,"").replace(/^\+/,"").replace(/^00/,"");
  if (/^[6789]\d{8}$/.test(d)) d = "34" + d;
  return d.length >= 9 && d.length <= 15 ? d : "";
}
function extraerContacto(texto){
  const t = String(texto||"");
  const email = (t.match(/[\w.+-]+@[\w-]+(\.[\w-]+)+/) || [""])[0].toLowerCase();
  let telefono = "";
  for (const m of t.match(/(?:\+|00)?\d[\d\s.\-()]{7,}\d/g) || []) { const n = normTel(m); if (n) { telefono = n; break; } }
  const wa = t.match(/^\[[^\]]+\]\s*([^:\n]{2,40}):/m); // «[19/10/26, 20:15] Juan Pérez: …» al compartir mensajes desde WhatsApp
  return {email, telefono, nombre: wa ? wa[1].trim() : ""};
}
const CORREO_PUBLICO = /@(gmail|googlemail|hotmail|outlook|live|msn|yahoo|icloud|me|protonmail|telefonica|movistar)\./i;
const solTitulo = s => s ? (s.nombre || s.empresa || (s.telefono ? "+" + s.telefono : "") || s.email || "Sin nombre") : "Solicitud eliminada";
const solUltimo = s => (s.mensajes||[]).slice(-1)[0];
const solPorAtender = s => s.sinLeer || ["nueva","curso"].includes(s.estado || "nueva");
const pillSol = e => `<span class="pill ${ {nueva:"bad",curso:"warn",presupuestada:"info",aceptada:"ok",descartada:""}[e||"nueva"] }">${ESTADO_SOL_TXT[e||"nueva"]}</span>`;
const mismoContacto = (a, b) => a.id !== b.id && ((a.telefono && a.telefono === b.telefono) || (a.email && a.email.toLowerCase() === (b.email||"").toLowerCase()));
async function actualizar(col, id, campos){
  if (modo === "nube" && window.FIREBASE_CONFIG) { db.collection(col).doc(id).update(campos).catch(errorGuardar); return; }
  const x = S[col].get(id); if (!x) return;
  await guardar(col, id, {...x, ...campos});
}
async function anadirMensaje(id, msg){
  const x = S.solicitudes.get(id); if (!x) return;
  const ultimo = msg.fecha > (x.ultimo||"") ? msg.fecha : x.ultimo;
  if (modo === "nube" && window.FIREBASE_CONFIG) { db.collection("solicitudes").doc(id).update({mensajes: firebase.firestore.FieldValue.arrayUnion(msg), ultimo}).catch(errorGuardar); return; }
  await guardar("solicitudes", id, {...x, mensajes:[...(x.mensajes||[]), msg], ultimo});
}

/* ---------- Análisis de ventas ---------- */
function desdePeriodo(){
  const d = new Date();
  if (UI.periodo === "30d") return new Date(d - 30*864e5);
  if (UI.periodo === "90d") return new Date(d - 90*864e5);
  if (UI.periodo === "ano") return new Date(d.getFullYear(),0,1);
  if (UI.periodo === "12m") return new Date(d.getFullYear(), d.getMonth()-11, 1);
  return new Date(0);
}
VISTAS.analisis = () => {
  const desde = desdePeriodo().toISOString();
  const ventas = C.movs.filter(m => m.tipo === "salida" && m.motivo === "venta" && (m.fecha||"") >= desde);
  let uds=0, imp=0, mar=0;
  const grupos = new Map();
  for (const m of ventas) {
    const p = S.productos.get(m.productoId), q = num(m.cantidad), i = q*num(m.precio), mg = i - q*num(p?.coste);
    uds += q; imp += i; mar += mg;
    const k = UI.agrupar === "categoria" ? (p?.categoria || "—") : m.productoId;
    const g = grupos.get(k) || {k, uds:0, imp:0, mar:0, n:0}; g.uds += q; g.imp += i; g.mar += mg; g.n++; grupos.set(k, g);
  }
  if (UI.agrupar === "categoria") CATS.forEach(c => { if (!grupos.has(c.id)) grupos.set(c.id, {k:c.id, uds:0, imp:0, mar:0, n:0}); });
  const met = UI.metrica;
  const arr = [...grupos.values()].sort((a,b) => b[met]-a[met]);
  const max = Math.max(1, ...arr.map(g => g[met]));
  const fmt = v => met === "uds" ? fN(v) + " ud" : fE(v);
  const etiqueta = g => UI.agrupar === "categoria" ? (CAT[g.k]?.nombre || "Sin categoría") : prodNombre(g.k);
  const color = g => UI.agrupar === "categoria" ? (CAT[g.k]?.c || "var(--muted)") : (CAT[S.productos.get(g.k)?.categoria]?.c || "var(--accent)");
  // Stock por categoría
  const porCat = CATS.map(c => { const ps = [...S.productos.values()].filter(p => p.categoria === c.id); return {c, n:ps.length, uds:ps.reduce((s,p)=>s+Math.max(0,stockDe(p.id)),0), val:ps.reduce((s,p)=>s+Math.max(0,stockDe(p.id))*num(p.coste),0)}; });
  return `${avisoEjemplos()}${cargando()}
  <section class="panel stack">
    <div class="head"><h2>Análisis de ventas</h2>
      <select id="periodo" data-ui="periodo" style="width:auto" aria-label="Periodo">${[["30d","Últimos 30 días"],["90d","Últimos 90 días"],["ano","Este año"],["12m","Últimos 12 meses"],["todo","Todo"]].map(([k,t]) => `<option value="${k}" ${UI.periodo===k?"selected":""}>${t}</option>`).join("")}</select>
    </div>
    <p class="cat" style="margin:0">Cuenta las salidas registradas como «Venta a cliente», al precio indicado en cada salida. El margen usa el coste de la ficha del producto.</p>
    <div class="kpis">
      <div class="kpi"><div class="k">Facturación</div><div class="v">${fE(imp)}</div></div>
      <div class="kpi"><div class="k">Margen estimado</div><div class="v">${fE(mar)}</div><div class="cat">${imp ? fN(mar/imp*100) + " % s/ venta" : "—"}</div></div>
      <div class="kpi"><div class="k">Unidades vendidas</div><div class="v">${fN(uds)}</div></div>
      <div class="kpi"><div class="k">Líneas de venta</div><div class="v">${fN(ventas.length)}</div></div>
    </div>
  </section>
  <div class="grid2">
    <section class="panel stack">
      <div class="head"><h3>Ventas por ${UI.agrupar === "categoria" ? "categoría" : "producto"}</h3>
        <div class="row">
          <div class="seg"><button class="neutral" aria-pressed="${UI.agrupar==="categoria"}" data-a="agrupar" data-t="categoria">Categoría</button><button class="neutral" aria-pressed="${UI.agrupar==="producto"}" data-a="agrupar" data-t="producto">Producto</button></div>
          <select id="metrica" data-ui="metrica" style="width:auto" aria-label="Medida"><option value="imp" ${met==="imp"?"selected":""}>Facturación</option><option value="mar" ${met==="mar"?"selected":""}>Margen</option><option value="uds" ${met==="uds"?"selected":""}>Unidades</option></select>
        </div>
      </div>
      ${arr.some(g => g.n) ? `<div class="hbars">${arr.slice(0, 15).map(g => `<div class="hb" style="--c:${color(g)}"><span class="lb">${h(etiqueta(g))}</span><span class="vl">${fmt(g[met])}</span><div class="bar"><i style="width:${Math.max(0, g[met])/max*100}%"></i></div></div>`).join("")}</div>`
        : `<div class="empty">No hay ventas en este periodo. Las salidas con motivo «Venta a cliente» aparecerán aquí.</div>`}
    </section>
    <section class="panel stack">
      <h3>Facturación mensual</h3>
      ${graficoMensual()}
    </section>
  </div>
  <section class="panel stack">
    <h3>Stock actual por categoría</h3>
    <div class="tableWrap"><table><thead><tr><th>Categoría</th><th class="n">Productos</th><th class="n">Unidades</th><th class="n">Valor a coste</th></tr></thead>
    <tbody>${porCat.map(r => `<tr><td><span style="display:inline-block;width:10px;height:10px;border-radius:3px;background:${r.c.c};margin-right:8px"></span>${h(r.c.nombre)}</td><td class="n">${fN(r.n)}</td><td class="n">${fN(r.uds)}</td><td class="n">${fE(r.val)}</td></tr>`).join("")}
    <tr><td><b>Total</b></td><td class="n"><b>${fN(porCat.reduce((s,r)=>s+r.n,0))}</b></td><td class="n"><b>${fN(porCat.reduce((s,r)=>s+r.uds,0))}</b></td><td class="n"><b>${fE(porCat.reduce((s,r)=>s+r.val,0))}</b></td></tr></tbody></table></div>
  </section>`;
};
function graficoMensual(){
  const now = new Date(), meses = [];
  for (let i=11;i>=0;i--) { const d = new Date(now.getFullYear(), now.getMonth()-i, 1); meses.push({k:d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"), lb:d.toLocaleString("es-ES",{month:"short"}).replace(".",""), v:0}); }
  const idx = Object.fromEntries(meses.map((m,i) => [m.k,i]));
  for (const m of C.movs) if (m.tipo==="salida" && m.motivo==="venta") { const k = (m.fecha||"").slice(0,7); if (k in idx) meses[idx[k]].v += num(m.cantidad)*num(m.precio); }
  const max = Math.max(...meses.map(m => m.v));
  if (!max) return `<div class="empty">Sin ventas en los últimos 12 meses.</div>`;
  const paso = Math.pow(10, Math.floor(Math.log10(max))); const top = Math.ceil(max/paso)*paso;
  const W=560, H=220, L=56, B=24, T=10, cw=(W-L-8)/12;
  const y = v => T + (H-T-B)*(1 - v/top);
  const ticks = [0, top/2, top];
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Facturación de los últimos 12 meses">
    ${ticks.map(t => `<line class="grid" x1="${L}" x2="${W-4}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-6}" y="${y(t)+4}" text-anchor="end">${fE(t)}</text>`).join("")}
    ${meses.map((m,i) => `<rect class="b ${i===11?"cur":""}" x="${L+i*cw+cw*.18}" y="${y(m.v)}" width="${cw*.64}" height="${Math.max(0,(H-B)-y(m.v))}" rx="3"><title>${m.lb}: ${fE(m.v)}</title></rect><text x="${L+i*cw+cw/2}" y="${H-6}" text-anchor="middle">${m.lb}</text>`).join("")}
  </svg>`;
}

/* ============ Modales ============ */
function abrirModal(m){ modal = m; pintarModal(); setTimeout(()=>{ const f = document.querySelector("#modal [autofocus]"); if (f) f.focus(); }, 30); }
function cerrarModal(){ modal = null; $("#modal").innerHTML = ""; }
function pintarModal(){
  if (!modal) return;
  C = calcular();
  const a = document.activeElement, aid = a && a.id;
  $("#modal").innerHTML = `<div class="ov" data-a="ovClick"><div class="md" role="dialog" aria-modal="true" aria-labelledby="mdT">
    <header><div><h2 id="mdT">${modal.titulo()}</h2>${modal.sub ? `<div class="cat">${modal.sub()}</div>` : ""}</div><button class="x" data-a="cerrar" aria-label="Cerrar">×</button></header>
    <div class="bd">${modal.cuerpo()}</div>${modal.pie ? `<footer>${modal.pie()}</footer>` : ""}</div></div>`;
  modal.montar && modal.montar();
  if (aid) { const e = document.getElementById(aid); if (e) e.focus({preventScroll:true}); }
}

    guardar: async () => {
      if (!M.nombre.trim()) { toast("Pon un nombre al producto", true); return; }

}

/* ---------- Pedidos: ficha y formulario ---------- */
function verPedido(tipo, id){
  const prov = tipo === "proveedor";
  const col = () => prov ? S.pedidosProveedor : S.pedidosCliente;
  abrirModal({vivo:true, conf:false,
    titulo:() => { const x = col().get(id); return h(prov ? (x?.proveedor||"Pedido a proveedor") : (x?.cliente||"Pedido de cliente")); },
    sub:() => { const x = col().get(id); if (!x) return ""; return prov ? `${h(ORIGEN[x.origen]||"")}${x.numero ? " · Pedido " + h(x.numero) : ""}${x.docRef ? " · Proforma/Albarán " + h(x.docRef) : ""} · ${fFecha(x.fecha)}` : [x.presupuesto && "Presupuesto " + h(x.presupuesto), x.albaran && "Albarán " + h(x.albaran), fFecha(x.fecha)].filter(Boolean).join(" · "); },
    cuerpo:() => {
      const x = col().get(id); if (!x) return `<div class="empty">Este pedido se ha eliminado.</div>`;
      const e = (prov ? C.estadoProv.get(id) : C.estadoCli.get(id)) || {tot:0, rec:0, ser:0, est:"Pendiente"};
      const hecho = prov ? C.recibido : C.servido;
      const pct = e.tot ? (prov ? e.rec : e.ser)/e.tot*100 : 0;
      const total = (x.lineas||[]).reduce((s,l) => s + num(l.cantidad)*num(prov ? l.coste : l.precio), 0);
      const vinc = prov ? (x.clientes||[]).map(c => S.pedidosCliente.get(c)).filter(Boolean) : [...S.pedidosProveedor.values()].filter(p => (p.clientes||[]).includes(id));
      return `<div class="row" style="justify-content:space-between">${pillEstado(e.est)}<span class="cat">${fN(prov?e.rec:e.ser)} de ${fN(e.tot)} ${prov?"recibidas":"servidas"} · Importe ${fE2(total)}</span></div>
      <div class="bar ok"><i style="width:${pct}%"></i></div>
      <div class="tableWrap"><table><thead><tr><th>Producto</th><th class="n">Pedido</th><th class="n">${prov?"Recibido":"Servido"}</th><th class="n">Falta</th>${prov?"":`<th class="n">Stock</th>`}<th></th></tr></thead><tbody>
        ${(x.lineas||[]).map(l => { const hq = Math.max(0, hecho.get(id+"|"+l.productoId)||0), falta = Math.max(0, num(l.cantidad)-hq); const st = stockDe(l.productoId); return `<tr>
          <td><div style="font-weight:600">${h(prodNombre(l.productoId))}</div><div class="cat">${fE2(num(prov?l.coste:l.precio))} / ${h(S.productos.get(l.productoId)?.unidad||"ud")}</div></td>
          <td class="n">${fN(l.cantidad)}</td><td class="n">${fN(hq)}</td><td class="n"><b>${fN(falta)}</b></td>
          ${prov ? "" : `<td class="n ${st<falta?"lowc":""}">${fN(st)}</td>`}
          <td class="n">${falta && !x.cancelado && S.productos.get(l.productoId) ? `<button class="btn small" data-a="movPedido" data-tipo="${prov?"entrada":"salida"}" data-ped="${id}" data-pid="${l.productoId}">${prov?"Recibir":"Servir"}</button>` : ""}</td></tr>`; }).join("")}
      </tbody></table></div>
      <div><h3 style="margin-bottom:6px">${prov ? "Vinculado a pedidos de cliente" : "Abastecido por pedidos a proveedor"}</h3>
        ${vinc.length ? `<div class="list">${vinc.map(v => prov ? filaPedCli(v) : filaPedProv(v)).join("")}</div>` : `<p class="cat" style="margin:0">${prov ? "Este pedido no está vinculado a ningún presupuesto o albarán de cliente. Edítalo para vincularlo." : "Ningún pedido a proveedor cubre este presupuesto o albarán todavía."}</p>`}
      </div>
      ${!prov && [...S.solicitudes.values()].some(s => (s.pedidosCliente||[]).includes(id)) ? `<div><h3 style="margin-bottom:6px">Solicitud del cliente</h3><div class="list">${[...S.solicitudes.values()].filter(s => (s.pedidosCliente||[]).includes(id)).map(filaSol).join("")}</div></div>` : ""}
      ${x.nota ? `<div><div class="lbl">Nota</div>${h(x.nota)}</div>` : ""}`;
    },
    pie:() => `<button class="btn danger" data-a="borrarPed" data-tipo="${tipo}" data-id="${id}">${modal.conf ? "Confirmar: eliminar" : "Eliminar"}</button><span style="flex:1"></span><button class="btn" data-a="editarPed" data-tipo="${tipo}" data-id="${id}">Editar</button>`
  });
}
function formPedido(tipo, id, preset, alGuardar){
  const prov = tipo === "proveedor";

  const M = Object.assign(prov ? {proveedor:"", origen:"china", numero:"", docRef:"", fecha:hoy(), fechaPrevista:"", clientes:[], nota:"", cancelado:false, lineas:[{productoId:"",cantidad:1,coste:""}]}
                               : {cliente:"", numero:"", presupuesto:"", albaran:"", fecha:hoy(), nota:"", cancelado:false, lineas:[{productoId:"",cantidad:1,precio:""}]},
                          x0 ? JSON.parse(JSON.stringify(x0)) : {}, preset||{});
  M.qVinc = "";
  const prods = [...S.productos.values()].sort((a,b) => (a.categoria||"").localeCompare(b.categoria||"") || a.nombre.localeCompare(b.nombre));
  const opciones = sel => `<option value="">Elige producto…</option>` + CATS.map(c => { const ps = prods.filter(p => p.categoria===c.id); return ps.length ? `<optgroup label="${h(c.nombre)}">${ps.map(p => `<option value="${p.id}" ${sel===p.id?"selected":""}>${h(p.nombre)}</option>`).join("")}</optgroup>` : ""; }).join("");
  const proveedores = [...new Set([...S.pedidosProveedor.values()].map(p => p.proveedor).concat(prods.map(p => p.proveedor)).filter(Boolean))].sort();
  const clientes = [...new Set([...S.pedidosCliente.values()].map(p => p.cliente).filter(Boolean))].sort();
  abrirModal({M, form:true,
    titulo:() => (id ? "Editar " : "Nuevo ") + (prov ? "pedido a proveedor" : "pedido de cliente"),
    cuerpo:() => {
      const kP = prov ? "coste" : "precio";
      const cands = prov ? [...S.pedidosCliente.values()].filter(c => (!c.cancelado && C.estadoCli.get(c.id)?.est !== "Servido") || (M.clientes||[]).includes(c.id))
        .filter(c => !M.qVinc || JSON.stringify([c.cliente,c.presupuesto,c.albaran,c.numero]).toLowerCase().includes(M.qVinc.toLowerCase())).sort((a,b) => (b.fecha||"").localeCompare(a.fecha||"")) : [];

          <div><label class="lbl" for="oFecha">Fecha pedido</label><input id="oFecha" type="date" data-m="fecha" value="${h(M.fecha)}"></div>
          <div><label class="lbl" for="oPrev">Llegada prevista</label><input id="oPrev" type="date" data-m="fechaPrevista" value="${h(M.fechaPrevista)}"></div>`

        ${M.lineas.map((l,i) => `<div class="linea"><select id="l${i}p" data-ml="${i}:productoId" aria-label="Producto">${opciones(l.productoId)}</select>
          <input id="l${i}q" type="number" inputmode="decimal" data-ml="${i}:cantidad" value="${h(l.cantidad)}" aria-label="Cantidad" placeholder="Cant.">

      </div>` : ""}

      ${id ? `<label class="row"><input type="checkbox" id="oCanc" data-mcheck="cancelado" ${M.cancelado?"checked":""}> Pedido cancelado</label>` : ""}`;
    },
    pie:() => `<button class="btn" data-a="cerrar">Cancelar</button><button class="btn primary" data-a="guardarPed">${id ? "Guardar cambios" : "Crear pedido"}</button>`,
    guardar: async () => {
      if (!(prov ? M.proveedor : M.cliente).trim()) { toast(prov ? "Indica el proveedor" : "Indica el cliente", true); return; }
      const lineas = M.lineas.filter(l => l.productoId && num(l.cantidad) > 0).map(l => prov ? {productoId:l.productoId, cantidad:num(l.cantidad), coste:l.coste===""?"":num(l.coste)} : {productoId:l.productoId, cantidad:num(l.cantidad), precio:l.precio===""?"":num(l.precio)});
      if (!lineas.length) { toast("Añade al menos una línea con producto y cantidad", true); return; }
      const {qVinc, ...datos} = M; datos.lineas = lineas;
      const pid = id || nuevoId();
      try { await guardar(prov ? "pedidosProveedor" : "pedidosCliente", pid, datos); toast(id ? "Pedido actualizado" : "Pedido creado"); if (alGuardar) await alGuardar(pid); verPedido(tipo, pid); }
      catch(e) { errorGuardar(e); }
    }

/* ============ Etiquetas de códigos de barras (PDF A4) ============ */
const FORMATOS = {
  "3x8": {nombre:"A4 · 24 etiquetas de 70 × 37 mm (3 × 8)", cols:3, filas:8, w:70, h:37, mx:0, my:0.5},
  "2x7": {nombre:"A4 · 14 etiquetas de 105 × 42,3 mm (2 × 7)", cols:2, filas:7, w:105, h:42.3, mx:0, my:0.45},
  "4x10": {nombre:"A4 · 40 etiquetas de 52,5 × 29,7 mm (4 × 10)", cols:4, filas:10, w:52.5, h:29.7, mx:0, my:0},
};
function etLista(M){ return [...S.productos.values()].filter(p => !M.cat || p.categoria === M.cat).sort((a,b) => (a.categoria||"").localeCompare(b.categoria||"") || a.nombre.localeCompare(b.nombre)); }
function etTotales(M){ const f = FORMATOS[M.formato]; const n = Object.entries(M.sel).filter(([id]) => S.productos.get(id)?.codigo).reduce((s,[,q]) => s + q, 0); const salto = Math.min(f.cols*f.filas-1, Math.max(0, Math.floor(num(M.salto)))); return {n, hojas: n ? Math.ceil((n + salto) / (f.cols*f.filas)) : 0}; }
function etResumen(){ const el = document.getElementById("etRes"); if (!el || !modal || !modal.M) return; const {n, hojas} = etTotales(modal.M); el.textContent = n ? `${n} etiqueta${n>1?"s":""} en ${hojas} hoja${hojas>1?"s":""}` : "Elige al menos un producto con código"; const b = document.querySelector('[data-a="etPdf"]'); if (b) b.disabled = !n; }
function formEtiquetas(){

      ${lista.length ? `<div class="checks" style="max-height:340px">${lista.map(p => `<label style="align-items:center"><input type="checkbox" data-etsel="${p.id}" ${M.sel[p.id]?"checked":""} ${p.codigo?"":"disabled"}>
        <span style="flex:1;min-width:0"><b>${h(p.nombre)}</b><br><span class="cat">${p.codigo ? `<span class="mono">${h(p.codigo)}</span>` : "Sin código"} · stock ${fN(stockDe(p.id))} ${h(p.unidad||"ud")}</span></span>
        <input type="number" min="0" inputmode="numeric" style="width:72px" aria-label="Copias de ${h(p.nombre)}" data-etq="${p.id}" value="${M.sel[p.id]||""}" placeholder="0" ${p.codigo?"":"disabled"}></label>`).join("")}</div>` : `<div class="empty">No hay productos en esta categoría.</div>`}`;
    },

document.addEventListener("input", e => { if (e.target.id === "etSalto" && modal && modal.M) { modal.M.salto = String(Math.max(0, Math.floor(num(e.target.value)) - 1)); etResumen(); } }, true);
async function generarEtiquetas(M){
  if (!window.jspdf || !window.JsBarcode) { toast("No se pudo cargar el generador de PDF. Comprueba la conexión.", true); return; }
  const f = FORMATOS[M.formato], porHoja = f.cols * f.filas;
  const items = [];
  for (const p of etLista({cat:""})) { const q = M.sel[p.id] || 0; if (p.codigo) for (let i=0;i<q;i++) items.push(p); }
  if (!items.length) return;
  if (items.length > 2000) { toast("Máximo 2000 etiquetas por PDF", true); return; }
  const doc = new window.jspdf.jsPDF({unit:"mm", format:"a4"});
  const cache = {};
  const imagen = codigo => {
    if (cache[codigo]) return cache[codigo];
    const cv = document.createElement("canvas");
    JsBarcode(cv, codigo, {format: esEAN13(codigo) ? "EAN13" : "CODE128", width:4, height:110, fontSize:30, margin:0, textMargin:4, background:"#ffffff", lineColor:"#000000"});
    return cache[codigo] = {url: cv.toDataURL("image/png"), ar: cv.width / cv.height};
  };
  const ox = (210 - f.cols*f.w) / 2, oy = (297 - f.filas*f.h) / 2;
  let pos = Math.min(porHoja-1, Math.max(0, Math.floor(num(M.salto))));
  items.forEach((p, i) => {
    if (i > 0 && pos % porHoja === 0) doc.addPage();
    const k = pos % porHoja, c = k % f.cols, r = Math.floor(k / f.cols);
    const x = ox + c*f.w, y = oy + r*f.h, pad = Math.min(3.5, f.w*0.06);
    const fs = f.w < 60 ? 7 : 8.5;
    doc.setFont("helvetica", "bold"); doc.setFontSize(fs);
    const lineas = doc.splitTextToSize(p.nombre, f.w - 2*pad).slice(0, 2);
    doc.text(lineas, x + f.w/2, y + pad + fs*0.32, {align:"center"});
    const textoH = lineas.length * fs * 0.42;
    const pie = [p.ref, p.ubicacion].filter(Boolean).join(" · ");
    const pieH = pie ? 3 : 0;
    const img = imagen(p.codigo);
    const maxW = f.w - 2*pad, maxH = f.h - 2*pad - textoH - pieH - 1;
    let bw = maxW, bh = bw / img.ar; if (bh > maxH) { bh = maxH; bw = bh * img.ar; }
    doc.addImage(img.url, "PNG", x + (f.w - bw)/2, y + pad + textoH + 0.8, bw, bh);
    if (pie) { doc.setFont("helvetica", "normal"); doc.setFontSize(6.5); doc.text(doc.splitTextToSize(pie, maxW)[0], x + f.w/2, y + f.h - pad + 0.6, {align:"center"}); }
    pos++;
  });
  await descargar("etiquetas-" + hoy() + ".pdf", doc.output("arraybuffer"));
}

/* ============ Escáner ============ */
let zxHints = null;
function hintsZX(){
  if (zxHints || !window.ZXing) return zxHints;
  const Z = window.ZXing, B = Z.BarcodeFormat;
  zxHints = new Map();
  zxHints.set(Z.DecodeHintType.TRY_HARDER, true);
  zxHints.set(Z.DecodeHintType.POSSIBLE_FORMATS, [B.EAN_13,B.EAN_8,B.UPC_A,B.UPC_E,B.CODE_128,B.CODE_39,B.ITF,B.QR_CODE,B.DATA_MATRIX]);
  return zxHints;
}
async function cargarImagen(file){
  if (window.createImageBitmap) { try { return await createImageBitmap(file, {imageOrientation:"from-image"}); } catch(e) { try { return await createImageBitmap(file); } catch(e2) {} } }
  return await new Promise((res, rej) => { const u = URL.createObjectURL(file), i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = u; });
}
async function leerCodigoDeFoto(file){
  const img = await cargarImagen(file);
  if ("BarcodeDetector" in window) {
    try { const r = await new BarcodeDetector().detect(img); if (r && r.length) return r[0].rawValue; } catch(e) {}
  }
  if (!window.ZXing) throw new Error("lector");
  const w0 = img.width, h0 = img.height;
  for (const max of [1400, 900, 2200]) {
    const k = Math.min(1, max / Math.max(w0, h0));
    const cv = document.createElement("canvas"); cv.width = Math.round(w0*k); cv.height = Math.round(h0*k);
    cv.getContext("2d", {willReadFrequently:true}).drawImage(img, 0, 0, cv.width, cv.height);
    try {
      const Z = window.ZXing, src = new Z.HTMLCanvasElementLuminanceSource(cv);
      const r = new Z.MultiFormatReader(); r.setHints(hintsZX());
      return r.decode(new Z.BinaryBitmap(new Z.HybridBinarizer(src))).getText();
    } catch(e) {}
  }
  return null;
}
async function alEscanearFoto(input){
  const file = input.files && input.files[0]; const destino = input.dataset.scan; input.value = "";
  if (!file) return;
  toast("Leyendo código…");
  let codigo = null;
  try { codigo = await leerCodigoDeFoto(file); } catch(e) { toast("No se pudo cargar el lector de códigos. Comprueba la conexión.", true); return; }
  if (!codigo) { toast("No se ha encontrado ningún código. Acerca la cámara, con buena luz y el código recto.", true); return; }
  usarCodigo(codigo, destino);
}
function usarCodigo(codigo, destino){
  if (destino === "prod" && modal && modal.M) { modal.M.codigo = codigo; pintarModal(); toast("Código leído: " + codigo); return; }
  if (modal && !modal.form) cerrarModal();
  vista = "escanear"; buscar(codigo);
}
// Cámara en directo: solo disponible cuando la app se abre como página propia (fuera del visor de Claude)
let lectorVivo = null;
function abrirVivo(){
  abrirModal({
    titulo:() => "Escáner en directo", sub:() => "Apunta al código de barras",
    cuerpo:() => `<video id="video" playsinline muted></video><p class="cat" style="margin:0">Si el navegador pregunta, permite el uso de la cámara.</p>`,

      lectorVivo.decodeFromConstraints({video:{facingMode:"environment"}}, "video", (res) => {

      }).catch(() => { toast("No se puede usar la cámara en directo aquí. Usa «Escanear código».", true); pararVivo(); cerrarModal(); });
    }

}
function pararVivo(){ try { lectorVivo && lectorVivo.reset(); } catch(e) {} lectorVivo = null; }
// Lector USB/Bluetooth (teclado): tecleo muy rápido acabado en Enter fuera de un campo
const buf = {s:"", t:0};
document.addEventListener("keydown", e => {
  const tg = e.target, enCampo = tg && (/^(INPUT|TEXTAREA|SELECT)$/.test(tg.tagName));
  if (enCampo) {
    if (e.key === "Enter" && tg.id === "busca") { e.preventDefault(); buscar(tg.value); }
    if (e.key === "Enter" && tg.id === "pCodigo") e.preventDefault();
    return;
  }
  if (e.key === "Escape" && modal) { pararVivo(); cerrarModal(); return; }
  const now = performance.now();
  if (now - buf.t > 80) buf.s = "";
  buf.t = now;
  if (e.key === "Enter") { if (buf.s.length >= 4) { e.preventDefault(); usarCodigo(buf.s, modal && modal.M && "codigo" in modal.M ? "prod" : "mov"); } buf.s = ""; return; }
  if (e.key.length === 1) buf.s += e.key;
});

  if (!o || o.app !== "shop4fit-stocks") { toast("El archivo no es una copia de Shop4Fit Stocks", true); return; }
  const n = COLS.reduce((s,c) => s + Object.keys(o[c]||{}).length, 0);
  abrirModal({form:true, titulo:() => "Restaurar copia", sub:() => "Copia del " + h(fFecha(o.fecha, true)),
    cuerpo:() => `<p style="margin:0">Se añadirán o sobrescribirán <b>${n}</b> registros (${COLS.map(c => Object.keys(o[c]||{}).length + " " + c).join(", ")}). Los registros que ya existan y no estén en la copia se mantienen.</p>`,
    pie:() => `<button class="btn" data-a="cerrar">Cancelar</button><button class="btn primary" id="btnRestaurar">Restaurar ${n} registros</button>`,

      catch(e) { errorGuardar(e); ev.target.disabled = false; } }; }
  });

      for (const c of COLS) o[c] = Object.fromEntries([...S[c]].map(([k,v]) => { const {id:_, ...r} = v; return [k, r]; }));
      descargar("shop4fit-stocks-copia-" + hoy() + ".json", JSON.stringify(o)); return; }
    case "csvStock": {
      const filas = [["Producto","Código","Referencia","Categoría","Tipo","Origen","Proveedor","Ubicación","Unidad","Stock","Stock mínimo","En camino","Reservado","Coste","PVP","Valor a coste"]];
      for (const p of [...S.productos.values()].sort((a,b)=>(a.categoria||"").localeCompare(b.categoria||"")||a.nombre.localeCompare(b.nombre))) filas.push([p.nombre,p.codigo,p.ref,CAT[p.categoria]?.nombre,p.sub,ORIGEN[p.origen],p.proveedor,p.ubicacion,p.unidad,dec(stockDe(p.id)),p.stockMin,dec(C.pendienteRecibir.get(p.id)||0),dec(C.reservado.get(p.id)||0),dec(p.coste),dec(p.pvp),dec(Math.max(0,stockDe(p.id))*num(p.coste))]);
      descargar("stock-" + hoy() + ".csv", csv(filas)); return; }
    case "csvMov": {
      const filas = [["Fecha","Tipo","Motivo","Producto","Código","Categoría","Cantidad","Precio unitario","Importe","Documento","Nº documento","Pedido proveedor","Pedido cliente","Nota"]];
      for (const m of C.movs) { const p = S.productos.get(m.productoId); filas.push([new Date(m.fecha).toLocaleString("es-ES"), m.tipo, MOTIVO_TXT[m.motivo]||"", p?.nombre||"", p?.codigo||"", CAT[p?.categoria]?.nombre||"", dec(m.tipo==="salida"?-num(m.cantidad):m.cantidad), dec(m.precio), dec(num(m.cantidad)*num(m.precio)), DOC_TXT[m.docTipo]||"", m.docNum, m.pedidoProveedorId?etiquetaProv(S.pedidosProveedor.get(m.pedidoProveedorId)):"", m.pedidoClienteId?etiquetaCli(S.pedidosCliente.get(m.pedidoClienteId)):"", m.nota]); }
      descargar("movimientos-" + hoy() + ".csv", csv(filas)); return; }
    case "borrarEjemplos":
      if (!UI.confEj) { UI.confEj = true; pintar(); return; }
      UI.confEj = false;
      try { for (const c of COLS) for (const d of [...S[c].values()]) if (d.ejemplo) await borrar(c, d.id); Object.assign(F, nuevoF()); toast("Datos de ejemplo borrados"); } catch(x) { errorGuardar(x); }
      pintar(); return;
  }
});
document.addEventListener("input", e => {
  const t = e.target, d = t.dataset;
  if (d.etq !== undefined && modal && modal.M) { const n = Math.max(0, Math.floor(num(t.value))); if (n) modal.M.sel[d.etq] = n; else delete modal.M.sel[d.etq]; const c = document.querySelector(`[data-etsel="${d.etq}"]`); if (c) c.checked = !!n; etResumen(); return; }
  if (d.etm !== undefined && modal && modal.M) { modal.M[d.etm] = t.value; etResumen(); return; }
  if (d.f !== undefined) { F[d.f] = t.value; if (d.f === "cantidad" || d.f === "contado") actualizarPrevisto(); return; }
  if (d.ui !== undefined && t.tagName === "INPUT") { UI[d.ui] = t.value; pintar(); return; }
  if (d.m !== undefined && modal && modal.M && t.type !== "checkbox") { modal.M[d.m] = t.value; if (d.rerender !== undefined && t.tagName === "INPUT") pintarModal(); return; }
  if (d.ml !== undefined && modal && modal.M) { const [i,k] = d.ml.split(":"); modal.M.lineas[+i][k] = t.value; return; }
});
document.addEventListener("change", e => {
  const t = e.target, d = t.dataset;
  if (d.etsel !== undefined && modal && modal.M) { if (t.checked) modal.M.sel[d.etsel] = modal.M.sel[d.etsel] || 1; else delete modal.M.sel[d.etsel]; const q = document.querySelector(`[data-etq="${d.etsel}"]`); if (q) q.value = modal.M.sel[d.etsel] || ""; etResumen(); return; }
  if (d.etm !== undefined && modal && modal.M) { modal.M[d.etm] = t.value; etResumen(); return; }
  if (d.scan !== undefined) { alEscanearFoto(t); return; }
  if (t.id === "copiaImp") { restaurarCopia(t); return; }
  if (d.f !== undefined && t.tagName === "SELECT") { F[d.f] = t.value; if (d.f === "pedido") aplicarPedido(); pintar(); return; }
  if (d.ui !== undefined && t.tagName === "SELECT") { UI[d.ui] = t.value; pintar(); return; }
  if (d.m !== undefined && t.tagName === "SELECT" && modal && modal.M) { modal.M[d.m] = t.value; if (d.rerender !== undefined) pintarModal(); return; }
  if (d.mcheck !== undefined && modal && modal.M) { modal.M[d.mcheck] = t.checked; return; }
  if (d.vinc !== undefined && modal && modal.M) { const s = new Set(modal.M.clientes||[]); t.checked ? s.add(d.vinc) : s.delete(d.vinc); modal.M.clientes = [...s]; return; }
  if (d.ml !== undefined && modal && modal.M) {
    const [i,k] = d.ml.split(":"); modal.M.lineas[+i][k] = t.value;
    if (k === "productoId") { const p = S.productos.get(t.value), kP = "proveedor" in modal.M ? "coste" : "precio"; const l = modal.M.lineas[+i]; if (p && (l[kP] === "" || l[kP] === undefined)) { l[kP] = kP === "coste" ? (p.coste ?? "") : (p.pvp ?? ""); pintarModal(); } }
  }
});
function actualizarPrevisto(){
  // Actualiza el texto del botón y el stock previsto sin repintar (para no perder el foco al teclear)
  const p = S.productos.get(F.pid); if (!p) return;
  const st = stockDe(p.id), q = num(F.cantidad), u = p.unidad||"ud";
  const prev = F.tipo === "entrada" ? st + q : F.tipo === "salida" ? st - q : num(F.contado);
  const b = document.querySelector('[data-a="registrar"]');
  if (b && F.tipo !== "ajuste") b.textContent = (F.tipo==="entrada"?"Registrar entrada":"Registrar salida") + " · " + fN(q) + " " + u;
  const pv = b && b.closest(".row").parentElement.querySelector(".muted b"); if (pv) pv.textContent = fN(prev) + " " + u;
}

iniciar();
