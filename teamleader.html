<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Conectar Teamleader · Shop4Fit Stocks</title>
<style>
:root{color-scheme:light;--bg:#edf0f3;--fg:#15202b;--muted:#566475;--accent:#2f5fc4;--line:#cdd5de}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.5 system-ui,sans-serif}
main{max-width:560px;margin:8vh auto;padding:0 16px}
.card{background:#fff;border:1px solid var(--line);border-radius:14px;padding:24px}
h1{font-size:22px;margin:0 0 8px}
code{display:block;word-break:break-all;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:12px;font-size:14px;margin:12px 0}
button{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:10px 16px;font:inherit;font-weight:600;cursor:pointer}
ol{padding-left:20px}.muted{color:var(--muted);font-size:14px}
</style>
</head>
<body>
<main><div class="card" id="c"></div></main>
<script>
// Página de vuelta de la autorización de Teamleader: muestra el código para darlo de alta en GitHub Actions
const u = new URLSearchParams(location.search), c = document.getElementById("c"), code = u.get("code");
const esc = s => String(s).replace(/[&<>"']/g, x => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[x]));
if (code) {
  c.innerHTML = `<h1>Teamleader autorizado</h1><p>Copia este código. Caduca en 10 minutos.</p><code id="k">${esc(code)}</code>
    <button id="b">Copiar código</button>
    <ol><li>Abre <a href="https://github.com/savaservicios2026/shop4fit-stocks/actions/workflows/importar-teamleader.yml" target="_blank" rel="noopener">GitHub → Actions → Importar presupuestos aceptados de Teamleader</a>.</li>
    <li>Pulsa <b>Run workflow</b>, pega el código en el campo y pulsa el botón verde <b>Run workflow</b>.</li></ol>
    <p class="muted">Solo hace falta una vez. Después, los presupuestos aceptados llegan solos a Pedidos › Nuevo cada 10 minutos.</p>`;
  document.getElementById("b").onclick = async e => { try { await navigator.clipboard.writeText(code); e.target.textContent = "Copiado"; } catch(x) { e.target.textContent = "Selecciónalo y cópialo a mano"; } };
} else {
  c.innerHTML = `<h1>No se ha autorizado</h1><p>${u.get("error") ? "Teamleader ha devuelto: " + esc(u.get("error")) : "Esta página se abre sola al autorizar Shop4Fit Stocks en Teamleader."}</p>`;
}
</script>
</body>
</html>
